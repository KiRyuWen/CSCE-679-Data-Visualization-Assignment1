<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Level 1 — Year/Month Temperature Heatmap</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="page-header">
    <h1>Hong Kong Monthly Temperature (1997–2017)</h1>
    <nav class="page-nav">
      <a class="is-active" href="index.html">Level 1</a>
      <a href="level2.html">Level 2</a>
    </nav>
  </header>

  <!-- Toggle between max and min temperature (requirement #2). -->
  <div class="controls">
    <fieldset class="metric-toggle">
      <legend>Temperature</legend>
      <label><input type="radio" name="metric" value="max" checked /> Max</label>
      <label><input type="radio" name="metric" value="min" /> Min</label>
    </fieldset>
    <!-- The color legend (requirement #4) is drawn into this container. -->
    <div id="legend" class="legend"></div>
  </div>

  <!-- The heatmap SVG is created inside this container by js/heatmap.js. -->
  <main id="chart" class="chart"></main>

  <!-- Single tooltip element reused by every cell (requirement #3). -->
  <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tooltip.js"></script>
  <script src="js/legend.js"></script>
  <script src="js/heatmap.js"></script>
  <script src="js/main-level1.js"></script>
</body>
</html>
